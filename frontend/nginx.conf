# Serve each front end on its own host and proxy the shared API.
map $host $frontend_entry {
    default /index.html;
    admin.localhost /admin.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads: videos up to 500 MB (UPLOAD_MAX_VIDEO_BYTES) and backup ZIPs up to ~2 GB
    # (IMPORT_MAX_BYTES); keep in sync.
    client_max_body_size 2100m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Docker's DNS. Looking the backend up at request time (through a variable) means a
    # rebuilt backend container — which gets a new IP — is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream uploads and media instead of buffering them on disk.
        proxy_request_buffering off;
        proxy_buffering off;
        # Local models can take minutes on long notes ("thorough" mode).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The service worker and manifest must never be cached, or updates would not arrive.
    location = /sw.js {
        if ($host = admin.localhost) { return 404; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        if ($host = admin.localhost) { return 404; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/admin(?:/(?<admin_path>.*))?$ {
        return 302 http://admin.localhost/$admin_path$is_args$args;
    }

    location = /admin.html {
        if ($host != admin.localhost) { return 302 http://admin.localhost/$is_args$args; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $frontend_entry =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $frontend_entry =404;
    }
}
