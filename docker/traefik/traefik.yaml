entryPoints:
  web:
    address: ":80"
    transport:
      respondingTimeouts:
        readTimeout: 0s
  notes:
    address: ":5173"
    transport:
      respondingTimeouts:
        # nginx already sets upload and streaming timeouts for AI Notes.
        readTimeout: 0s
  pgadmin:
    address: ":5050"
  traefik:
    address: ":8080"

providers:
  file:
    directory: /etc/traefik/routes
    watch: true

api:
  dashboard: true

ping: {}
